<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snek - MP</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" type="text/css" href="css/index.css">
</head>
<body>
<h1>Snek - The multiplayer snake</h1>
<div class="small-container">
    <p id="join_error" role="alert" hidden></p>
    <form method="post" action="/joingame">
        <label for="gameId">
            Join a game using its url or id
        </label>
        <input placeholder="game id" id="gameId" name="gameId">
        <button class="btn" type="submit"><span>Join game</span></button>
    </form>
    <form method="post" action="/generateid">
        <!--<label>
            Your lobby name
            <input placeholder="game id" name="">
        </label>-->
        <input class="btn" type="submit" value="Create Game"/>
    </form>
</div>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'unknown-game') {
            var el = document.getElementById('join_error');
            el.textContent = 'That game id does not exist. Double-check it or create a new game.';
            el.hidden = false;
        }
    })();
</script>
</body>
</html>
