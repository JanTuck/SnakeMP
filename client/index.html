<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snek - The multiplayer snake</title>
    <link rel="icon" href="/img/snek.png">
    <link rel="stylesheet" type="text/css" href="css/index.css">
</head>
<body>
    <main class="hero">
        <header class="brand">
            <img class="brand-snek" src="/img/snek.png" alt="" width="72" height="72">
            <h1>Snek</h1>
            <p class="tagline">The multiplayer snake</p>
        </header>

        <p id="join_error" role="alert" hidden></p>

        <section class="card">
            <h2 class="card-title">Join a game</h2>
            <form method="post" action="/joingame" class="join-form">
                <label for="gameId">Game id or link</label>
                <input id="gameId" name="gameId" placeholder="e.g. 12345" autocomplete="off">
                <button class="btn btn-join" type="submit">Join game</button>
            </form>
            <div class="divider" role="separator"><span>or</span></div>
            <form method="post" action="/generateid" class="create-form">
                <button class="btn btn-create" type="submit">Create a new game</button>
                <p class="form-hint">Shares a link you can send to friends</p>
            </form>
        </section>

        <footer class="hints">
            <span>🍎 eat apples</span>
            <span>📦 crack supply crates</span>
            <span>⭐ catch the golden apple</span>
        </footer>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('error') === 'unknown-game') {
                var el = document.getElementById('join_error');
                el.textContent = 'That game id does not exist. Double-check it or create a new game.';
                el.hidden = false;
            }
        })();
    </script>
</body>
</html>
