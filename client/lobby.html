<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake | Lobby</title>
    <link rel="icon" href="data:,">
</head>
<body>
<form method="post">
    <p>
        <label for="lobbyName">
            Lobby name
            <input id="lobbyName" name="lobbyName" type="text"/>
        </label>
    </p>
    <p>
        <label for="maxPlayers">
            Max players
            <input id="maxPlayers" name="maxPlayers" type="number" min="2" max="8" value="4"/>
        </label>
    </p>
    <p>
        <label for="directInvite">
            Direct invite
            <input id="directInvite" name="directInvite" type="text"/>
        </label>
    </p>
    <button type="submit">Start</button>
</form>
</body>
</html>
