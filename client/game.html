<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snek | Game</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
<p id="game_error" role="alert"></p>
<div class="background_blur" id="game_popup">
    <div class="popup">
        <section class="popup_content">
            <h1>Choose your username</h1>
            <form id="join_form">
                <label for="username">Username (4&ndash;16 characters)</label>
                <input id="username" type="text" required placeholder="Username"
                       minlength="4" maxlength="16" autocomplete="nickname">
                <button type="submit" class="btn"><span>Join</span></button>
            </form>
        </section>
    </div>
</div>
<canvas id="canvas" aria-label="Snake game board" style="background-color: antiquewhite" width="1920" height="960">
</canvas>
<!-- Serve the client straight from the running socket.io server so the
     versions always match, unlike the previously pinned CDN copy. -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/userInput.js" type="module"></script>
<script src="/js/rendering.js" type="module"></script>
<script>
    const socket = io();
    //Set last used username if present
    let domUsername = document.getElementById('username');
    let savedUsername = null;
    let hasJoined = false;
    try {
        savedUsername = localStorage.getItem("snake_username");
        if (savedUsername !== null) {
            domUsername.value = savedUsername;
        }
    } catch (e) { /* storage unavailable; keep default */ }
    domUsername.focus();

    document.getElementById('join_form').addEventListener('submit', () => {
        const username = domUsername.value;
        socket.emit('clientReady', username);
        hasJoined = true;
        try {
            localStorage.setItem("snake_username", username);
        } catch (e) { /* storage unavailable */ }
    });

    // After a reconnect the server sees a brand new socket, so rejoin
    // automatically with the last used username.
    socket.on('connect', () => {
        if (hasJoined && savedUsername !== null) {
            socket.emit('clientReady', savedUsername);
        }
    });

</script>
</body>
</html>
