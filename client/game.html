<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snek | Game</title>
    <link rel="icon" href="/img/snek.png">
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
<p id="game_error" role="alert"></p>
<div class="background_blur" id="game_popup">
    <div class="popup">
        <section class="popup_content">
            <h1>Choose your username</h1>
            <form id="join_form">
                <label for="username">Username (4&ndash;16 characters)</label>
                <input id="username" type="text" required placeholder="Username"
                       minlength="4" maxlength="16" autocomplete="nickname">
                <button type="submit" class="btn"><span>Join</span></button>
            </form>
        </section>
    </div>
</div>
<canvas id="canvas" aria-label="Snake game board" width="1920" height="960">
</canvas>
<aside id="hud" aria-label="Game status"></aside>
<script src="/vendor/gsap.min.js"></script>
<script src="/js/transport.js"></script>
<script src="/js/userInput.js" type="module"></script>
<script src="/js/rendering.js" type="module"></script>
<script>
    // This page always belongs to the lobby in its URL: /game/<id>.
    const LOBBY_ID = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '') || '12345';
    //Set last used username if present
    let domUsername = document.getElementById('username');
    let savedUsername = null;
    let hasJoined = false;
    try {
        savedUsername = localStorage.getItem("snake_username");
        if (savedUsername !== null) {
            domUsername.value = savedUsername;
        }
    } catch (e) { /* storage unavailable; keep default */ }
    domUsername.focus();

    document.getElementById('join_form').addEventListener('submit', (event) => {
        event.preventDefault(); // Stay on the page; the form must not reload it.
        const username = domUsername.value;
        socket.emit('clientReady', username, LOBBY_ID);
        hasJoined = true;
        try {
            localStorage.setItem("snake_username", username);
            savedUsername = username; // Reconnects replay the last used name.
        } catch (e) { /* storage unavailable */ }
    });

    // After a reconnect the server sees a brand new socket, so rejoin
    // automatically with the last used username.
    socket.on('connect', () => {
        if (hasJoined && savedUsername !== null) {
            socket.emit('clientReady', savedUsername, LOBBY_ID);
        }
    });

</script>
</body>
</html>
