<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snek | Game</title>
    <link rel="icon" href="/img/snek.png">
    <link rel="stylesheet" href="/css/game.css?v=20260824.3">
    <link rel="stylesheet" href="/css/chat.css?v=20260824.3">
</head>
<body>
<p id="game_error" role="alert"></p>
<div class="background_blur" id="game_popup">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="join_title" aria-describedby="join_context">
        <section class="popup_content">
            <div class="popup-heading">
                <h1 id="join_title">Enter the arena</h1>
                <p id="join_context">Lobby <strong id="lobby_ref">12345</strong> is ready. Choose how you appear to the other players.</p>
            </div>
            <section class="invite-panel" aria-labelledby="invite_title">
                <div class="invite-heading">
                    <h2 id="invite_title">Invite players</h2>
                    <p>Send this link. If the lobby has a password, share it separately.</p>
                </div>
                <label class="sr-only" for="invite_url">Lobby invite link</label>
                <div class="invite-link-row">
                    <input id="invite_url" type="url" readonly spellcheck="false" aria-describedby="invite_status">
                    <div class="invite-actions">
                        <button id="share_link" class="invite-action" type="button">
                            <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="15" cy="4" r="2.25"/><circle cx="5" cy="10" r="2.25"/><circle cx="15" cy="16" r="2.25"/><path d="m7 9 6-4M7 11l6 4"/></svg>
                            <span>Share</span>
                        </button>
                        <button id="copy_link" class="invite-action" type="button">
                            <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M13 7V5.5A1.5 1.5 0 0 0 11.5 4h-7A1.5 1.5 0 0 0 3 5.5v7A1.5 1.5 0 0 0 4.5 14H7"/></svg>
                            <span id="copy_link_label">Copy</span>
                        </button>
                    </div>
                </div>
                <p id="invite_status" class="invite-status" role="status" aria-live="polite"></p>
            </section>
            <form id="join_form">
                <div class="field">
                    <label for="username">Player name <span>3&ndash;24 · max 4 non-letters</span></label>
                    <input id="username" name="username" type="text" required placeholder="Choose a name"
                           autocomplete="nickname" spellcheck="false">
                </div>
                <div class="field">
                    <label for="lobby_password">Lobby password <span>Optional</span></label>
                    <input id="lobby_password" name="lobby_password" type="password"
                           placeholder="Leave blank for open lobbies" maxlength="64"
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn"><span>Join lobby</span><span aria-hidden="true">&rarr;</span></button>
                <p id="join_status" class="join-status" role="status" aria-live="polite"></p>
            </form>
            <p class="popup-footnote">Arrow keys or WASD to steer. Space activates your boost.</p>
        </section>
    </div>
</div>
<canvas id="canvas" aria-label="Snake game board" width="2048" height="1152">
</canvas>
<div id="nameplates" aria-hidden="true"></div>
<aside id="hud" aria-label="Game status"></aside>
<section id="game_chat" class="game-chat" aria-label="Lobby chat" hidden>
    <div id="chat_history" class="chat-history" role="log" aria-live="polite"
         aria-relevant="additions" aria-label="Chat history"></div>
    <form id="chat_form" class="chat-form" autocomplete="off">
        <label class="sr-only" for="chat_input">Message the lobby</label>
        <input id="chat_input" name="message" type="text" inputmode="text"
               enterkeyhint="send" autocomplete="off" autocapitalize="sentences"
               spellcheck="true" aria-describedby="chat_limit"
               placeholder="Message the lobby">
        <button id="chat_send" class="chat-send" type="submit">Send</button>
        <span id="chat_limit" class="sr-only">Up to 96 characters and 160 UTF-8 bytes.</span>
        <span id="chat_status" class="sr-only" role="status" aria-live="polite"></span>
    </form>
    <button id="chat_open" class="chat-open" type="button" aria-label="Open chat"
            aria-expanded="false" title="Open chat (T)">Chat</button>
</section>
<script src="/js/share.js?v=20260824.3"></script>
<script src="/js/transport.js?v=20260824.3"></script>
<script src="/js/chat.js?v=20260824.3"></script>
<script src="/js/userInput.js?v=20260824.3" type="module"></script>
<script src="/js/rendering.js?v=20260824.3" type="module"></script>
<script>
    // This page always belongs to the lobby in its URL: /game/<id>.
    const LOBBY_ID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '') || '12345';
    document.getElementById('lobby_ref').textContent = LOBBY_ID;
    //Set last used username if present
    let domUsername = document.getElementById('username');
    const domPassword = document.getElementById('lobby_password');
    const joinForm = document.getElementById('join_form');
    const joinButton = joinForm.querySelector('button[type="submit"]');
    const joinStatus = document.getElementById('join_status');
    let savedUsername = null;
    let savedPassword = '';
    let hasJoined = false;
    let joinPending = false;
    let joinTimeout = 0;
    const JOIN_TIMEOUT_MS = 5000;
    try {
        savedUsername = localStorage.getItem("snake_username");
        if (savedUsername !== null) {
            domUsername.value = savedUsername;
        }
    } catch (e) { /* storage unavailable; keep default */ }
    let passwordLoaded = false;
    try {
        const lobbyPasswordKey = `snek:lobby-password:${LOBBY_ID}`;
        const lobbyPassword = sessionStorage.getItem(lobbyPasswordKey);
        if (lobbyPassword !== null) {
            savedPassword = lobbyPassword;
            passwordLoaded = true;
        } else {
            const createdPassword = sessionStorage.getItem('snek:create-password');
            if (createdPassword !== null) {
                sessionStorage.removeItem('snek:create-password');
                sessionStorage.setItem(lobbyPasswordKey, createdPassword);
                savedPassword = createdPassword;
                passwordLoaded = true;
            }
        }
    } catch (e) { /* storage unavailable; leave the password empty */ }
    if (!passwordLoaded && window.name.startsWith('snek-password-handoff:')) {
        try {
            const handoff = JSON.parse(window.name.slice('snek-password-handoff:'.length));
            window.name = '';
            if (handoff && typeof handoff.password === 'string' &&
                (handoff.kind === 'create' || (handoff.kind === 'lobby' && handoff.lobby === LOBBY_ID))) {
                savedPassword = handoff.password;
            }
        } catch (e) { window.name = ''; }
    }
    if (domPassword !== null) domPassword.value = savedPassword;
    domUsername.focus();

    function setJoinPending(pending, message = '') {
        joinPending = pending;
        joinButton.disabled = pending;
        joinForm.setAttribute('aria-busy', pending ? 'true' : 'false');
        if (joinStatus !== null) joinStatus.textContent = message;
        if (!pending && joinTimeout) {
            clearTimeout(joinTimeout);
            joinTimeout = 0;
        }
    }

    function armJoinTimeout() {
        if (joinTimeout) clearTimeout(joinTimeout);
        joinTimeout = setTimeout(() => {
            joinTimeout = 0;
            if (!joinPending) return;
            setJoinPending(false, 'The connection stalled. Reconnecting now…');
            socket.reconnect?.();
        }, JOIN_TIMEOUT_MS);
    }

    joinForm.addEventListener('submit', (event) => {
        event.preventDefault(); // Stay on the page; the form must not reload it.
        if (joinPending) return;
        const username = domUsername.value.trim();
        const password = domPassword?.value || '';
        const usernameLength = Array.from(username).length;
        const usernameBytes = new TextEncoder().encode(username).length;
        const usernameNonLetters = Array.from(username).filter((character) => !/^\p{L}$/u.test(character)).length;
        const usernameValid = usernameLength >= 3 && usernameLength <= 24 &&
            usernameBytes <= 255 && usernameNonLetters <= 4;
        const passwordValid = new TextEncoder().encode(password).length <= 64;
        domUsername.setCustomValidity(usernameValid ? '' :
            'Use 3 to 24 characters, with no more than 4 digits, spaces, symbols, or emoji.');
        if (domPassword !== null) {
            domPassword.setCustomValidity(passwordValid ? '' : 'Password must be 64 UTF-8 bytes or fewer.');
        }
        if (!usernameValid) {
            domUsername.reportValidity();
            return;
        }
        if (!passwordValid) {
            domPassword?.reportValidity();
            return;
        }
        savedUsername = username;
        savedPassword = password;
        hasJoined = true;
        setJoinPending(true, 'Joining lobby…');
        armJoinTimeout();
        socket.emit('clientReady', username, LOBBY_ID, password);
        try {
            localStorage.setItem("snake_username", username);
        } catch (e) { /* storage unavailable */ }
        try {
            sessionStorage.setItem(`snek:lobby-password:${LOBBY_ID}`, password);
        } catch (e) { /* storage unavailable; reconnect still uses memory */ }
    });

    // After a reconnect the server sees a brand new socket, so rejoin
    // automatically with the last used username.
    socket.on('connect', () => {
        if (hasJoined && savedUsername !== null) {
            setJoinPending(true, 'Reconnecting…');
            armJoinTimeout();
            socket.emit('clientReady', savedUsername, LOBBY_ID, savedPassword);
        }
    });
    socket.on('init', () => setJoinPending(false));
    socket.on('game_error', () => {
        setJoinPending(false);
        // A container refresh clears in-memory lobbies while an already-open
        // tab can still show its old join dialog. Confirm the route after an
        // error and recover to the landing page only when that lobby is gone;
        // an existing passworded lobby must remain available for a retry.
        if (typeof fetch !== 'function') return;
        fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then((response) => {
            if (response.redirected) window.location.replace('/?error=unknown-game');
        }).catch(() => { /* reconnect handling remains authoritative */ });
    });

</script>
</body>
</html>
